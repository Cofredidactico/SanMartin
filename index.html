  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames

=\"font-size:12px;color:{{theme.muted}};margin:6px 0 0;\">Cofre Didáctico<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"text-align:center;min-width:200px;\">\n          <div style=\"border-top:2px solid {{theme.border}};padding-top:6px;font-size:13px;color:{{theme.muted}};\">Firma del/la docente<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;min-width:150px;\">\n          <div style=\"border-top:2px solid {{theme.border}};padding-top:6px;font-size:13px;color:{{theme.muted}};\">{{diploma.institucion}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isDocentes}}\" hint-placeholder-val=\"{{true}}\">\n  <section style=\"padding:{{L.pad}};max-width:1020px;margin:0 auto;animation:fadeSlideUp .4s ease;\">\n    <h2 style=\"font-size:{{fs.h2}};color:{{theme.headingColor}};margin:0 0 8px;font-weight:600;\">Zona docente<\u002Fh2>\n    <p style=\"font-size:{{fs.body}};color:{{theme.muted}};margin:0 0 34px;max-width:640px;\">Todo lo que necesitás para llevar la plataforma al aula: objetivos, contenidos y secuencia sugerida para trabajarla en el aula.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;\">\n      <sc-for list=\"{{docenteCards}}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"background:{{theme.panel}};border:3px solid {{theme.border}};border-radius:26px;padding:24px;\">\n          <h3 style=\"margin:0 0 12px;font-size:{{fs.h3}};color:{{theme.accent}};font-weight:600;\">{{d.title}}<\u002Fh3>\n          <sc-for list=\"{{d.items}}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;margin-bottom:10px;\">\n              <span style=\"color:{{theme.accent2}};font-weight:700;\">•<\u002Fspan>\n              <span style=\"font-size:{{fs.small}};color:{{theme.text}};line-height:1.5;\">{{it}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div class=\"no-print\" style=\"margin-top:28px;background:{{theme.quoteBg}};border:3px solid {{theme.accent}};border-radius:26px;padding:22px 26px;\">\n      <h3 style=\"margin:0 0 6px;font-size:{{fs.h3}};color:{{theme.headingColor}};font-weight:600;\">⚙️ Panel del docente<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:{{fs.small}};color:{{theme.muted}};\">Elegí qué se muestra en esta tablet. Se guarda en el dispositivo.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <sc-for list=\"{{docentePanel}}\" as=\"d\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{d.onClick}}\" style=\"display:flex;align-items:center;gap:12px;border:3px solid {{theme.border}};background:{{d.bg}};color:{{d.color}};font-family:'Fredoka',sans-serif;font-size:{{fs.small}};font-weight:600;padding:12px 16px;border-radius:16px;cursor:pointer;text-align:left;\">{{d.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"no-print\" style=\"margin-top:20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;\">\n      <button sc-camel-on-click=\"{{resetProgress}}\" style=\"background:transparent;border:2px solid {{theme.border}};color:{{theme.text}};font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;padding:12px 22px;border-radius:16px;cursor:pointer;\">Reiniciar progreso del estudiante<\u002Fbutton>\n      <span style=\"font-size:{{fs.small}};color:{{theme.muted}};\">Borra estrellas y nombre guardados en este dispositivo.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"padding:{{L.footerPad}};background:{{theme.headerBg}};border-top:3px solid {{theme.accent}};display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:14px;color:{{theme.muted}};\">\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <img src=\"c9efede8-d8b7-4f1c-9355-db25aab1182f\" alt=\"Cofre Didáctico\" style=\"height:44px;\">\n      <span>Creado por <strong style=\"color:{{theme.text}};\">Cofre Didáctico<\u002Fstrong> para conocer la vida de José de San Martín<\u002Fspan>\n    <\u002Fdiv>\n    <div>🇦🇷 Plataforma educativa interactiva · <strong style=\"color:{{theme.text}};\">17 de Agosto – Paso a la Inmortalidad<\u002Fstrong><\u002Fdiv>\n  <\u002Ffooter>\n\n  <nav class=\"no-print\" style=\"display:{{L.tabs}};position:fixed;left:0;right:0;bottom:0;z-index:40;background:{{theme.headerBg}};border-top:4px solid {{theme.accent}};padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -8px 24px -14px rgba(0,0,0,0.4);\">\n    <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{t.onClick}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:{{t.bg}};color:{{t.color}};border:none;border-radius:18px;padding:8px 2px;cursor:pointer;font-family:'Fredoka',sans-serif;font-size:11px;font-weight:600;min-height:56px;\">\n        <span aria-hidden=\"true\" style=\"font-size:22px;line-height:1;\">{{t.icon}}<\u002Fspan><span>{{t.label}}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  \n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;modoLibre&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Docente&quot;},&quot;sonidos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Docente&quot;},&quot;institucion&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Escuela&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Docente&quot;}}\">\n\nclass Component extends DCLogic {\n  static CHAPTERS = [\n    {\n      title:'Un niño de Yapeyú',\n      p1:'José Francisco de San Martín nació el 25 de febrero de 1778 en Yapeyú, un pequeño pueblo de las antiguas misiones guaraníes, en la actual provincia de Corrientes. Su papá, Juan de San Martín, era el administrador del lugar.',\n      p2:'Cuando tenía cinco años la familia se mudó a Buenos Aires y, poco después, viajó a España. A los once años José entró como cadete en el Regimiento de Murcia: empezaba una vida de soldado.',\n      fact:'De chico jugaba entre las ruinas de las misiones jesuíticas y escuchaba hablar guaraní: por eso a veces se lo llama “el correntino de Yapeyú”.',\n      words:['Yapeyú','Corrientes','1778'],\n      imgLabel:'imagen: casa natal de Yapeyú',\n      dates:[{year:'1778',text:'Nace en Yapeyú el 25 de febrero.'},{year:'1789',text:'Ingresa como cadete en España.'}]\n    },\n    {\n      title:'Soldado en Europa',\n      p1:'Durante más de veinte años San Martín fue militar en Europa. Peleó en el norte de África, en el mar y en España, donde aprendió estrategia, disciplina y cómo organizar un ejército.',\n      p2:'Cuando supo que en América del Sur había comenzado la lucha por la independencia, decidió volver. Cruzó el océano y llegó a Buenos Aires en 1812 para ofrecer su experiencia a la causa de la libertad.',\n      fact:'Llegó al Río de la Plata en la fragata inglesa George Canning, junto a otros jóvenes que también querían liberar América.',\n      words:['Europa','Estrategia','1812'],\n      imgLabel:'imagen: barco cruzando el océano',\n      dates:[{year:'1808',text:'Combate en España contra la invasión napoleónica.'},{year:'1812',text:'Llega a Buenos Aires.'}]\n    },\n    {\n      title:'Los Granaderos a Caballo',\n      p1:'En 1813 creó el Regimiento de Granaderos a Caballo: soldados valientes, muy entrenados y unidos por un código de honor. San Martín les enseñaba que el respeto y la disciplina valían tanto como el coraje.',\n      p2:'Ese mismo año los Granaderos tuvieron su bautismo de fuego en el combate de San Lorenzo, junto al río Paraná, y ganaron. Fue la primera gran victoria de su ejército.',\n      fact:'El Regimiento de Granaderos a Caballo existe todavía hoy y es el que acompaña al Presidente en los actos oficiales.',\n      words:['Granaderos','San Lorenzo','1813'],\n      imgLabel:'imagen: granaderos a caballo',\n      dates:[{year:'1813',text:'Crea el Regimiento de Granaderos a Caballo.'},{year:'1813',text:'Combate de San Lorenzo, 3 de febrero.'}]\n    },\n    {\n      title:'El Cruce de los Andes',\n      p1:'San Martín pensó un plan enorme, el Plan Continental: para que nuestra tierra fuera libre había que liberar también Chile y Perú. En Mendoza formó el Ejército de los Andes con la ayuda de todo el pueblo cuyano, que donó comida, telas, mulas y hasta sus joyas.',\n      p2:'Entre enero y febrero de 1817 cruzó la Cordillera de los Andes por pasos altísimos y helados. Del otro lado venció en la batalla de Chacabuco (1817) y luego en Maipú (1818), asegurando la independencia de Chile.',\n      fact:'Cruzaron más de 5.000 personas junto a miles de mulas y caballos. Muchos animales no resistieron la altura: fue una hazaña de organización.',\n      words:['Cordillera','Chacabuco','Maipú'],\n      imgLabel:'imagen: cruce de la cordillera',\n      dates:[{year:'1817',text:'Cruce de los Andes y victoria en Chacabuco.'},{year:'1818',text:'Batalla de Maipú: Chile queda libre.'}]\n    },\n    {\n      title:'Libertador del Perú y retiro',\n      p1:'Desde Chile organizó la Expedición Libertadora al Perú. El 28 de julio de 1821 proclamó la independencia del Perú y fue nombrado Protector, pero no quiso quedarse con el poder.',\n      p2:'Después de reunirse con Simón Bolívar en Guayaquil, decidió retirarse. Vivió sus últimos años en Europa y falleció el 17 de agosto de 1850 en Boulogne-sur-Mer, Francia. Hoy lo recordamos como el Padre de la Patria.',\n      fact:'Sus restos descansan en un mausoleo de la Catedral de Buenos Aires, custodiado por los Granaderos que él mismo creó.',\n      words:['Perú','1821','Padre de la Patria'],\n      imgLabel:'imagen: proclamación de la independencia del Perú',\n      dates:[{year:'1821',text:'Proclama la independencia del Perú.'},{year:'1850',text:'Fallece el 17 de agosto en Francia.'}]\n    }\n  ];\n\n  static QUIZ = [\n    { q:'¿En qué ciudad nació San Martín?', options:['Mendoza','Yapeyú, Corrientes','Lima','Salta'], correct:1 },\n    { q:'¿En qué año nació?', options:['1810','1850','1778','1816'], correct:2 },\n    { q:'¿Cómo se llamaba el regimiento que creó en 1813?', options:['Húsares del Rey','Dragones de Buenos Aires','Infantes de Cuyo','Granaderos a Caballo'], correct:3 },\n    { q:'¿Qué cordillera cruzó con su ejército?', options:['Los Andes','Los Alpes','El Himalaya','Los Urales'], correct:0 },\n    { q:'¿En qué año fue el Cruce de los Andes?', options:['1850','1817','1778','1821'], correct:1 },\n    { q:'¿Quiénes ayudaron a preparar el Ejército de los Andes?', options:['Los realistas','Nadie, lo hizo solo','El pueblo cuyano','Los ingleses'], correct:2 },\n    { q:'¿Qué países ayudó a liberar además de Argentina?', options:['Brasil y Uruguay','México y Cuba','Bolivia y Paraguay','Chile y Perú'], correct:3 },\n    { q:'¿Qué se conmemora el 17 de agosto?', options:['Su nacimiento','Su paso a la inmortalidad','El cruce de los Andes','La independencia'], correct:1 }\n  ];\n  static QUIZ_FACIL = [\n    { q:'¿Cómo se llamaba San Martín?', options:['José','Juan','Pedro','Manuel'], correct:0 },\n    { q:'¿Con qué animal viajaban los granaderos?', options:['Caballo','Elefante','Camello','Perro'], correct:0 },\n    { q:'¿Qué cordillera cruzó?', options:['Los Andes','Los Alpes','El Himalaya','Los Urales'], correct:0 },\n    { q:'¿De qué colores es la bandera argentina?', options:['Celeste y blanca','Roja y verde','Amarilla','Negra'], correct:0 },\n    { q:'¿Qué día lo recordamos?', options:['17 de agosto','1 de enero','24 de diciembre','9 de julio'], correct:0 }\n  ];\n  static QUIZ_DIFICIL = [\n    { q:'¿En qué fragata inglesa llegó al Río de la Plata en 1812?', options:['Santísima Trinidad','George Canning','Sarmiento','La Argentina'], correct:1 },\n    { q:'¿En qué combate fue el bautismo de fuego de los Granaderos?', options:['San Lorenzo','Maipú','Chacabuco','Salta'], correct:0 },\n    { q:'¿Con qué libertador se reunió en Guayaquil en 1822?', options:['Belgrano','Simón Bolívar','Güemes','Artigas'], correct:1 },\n    { q:'¿En qué año proclamó la independencia del Perú?', options:['1810','1816','1821','1825'], correct:2 },\n    { q:'¿En qué ciudad de Francia falleció?', options:['Boulogne-sur-Mer','París','Marsella','Lyon'], correct:0 },\n    { q:'¿Cómo se llamó el ejército que formó en Mendoza?', options:['Ejército del Norte','Ejército de los Andes','Ejército Grande','Ejército del Sur'], correct:1 }\n  ];\n  static VF = [\n    { s:'San Martín nació en Yapeyú, Corrientes.', v:true, e:'Nació allí el 25 de febrero de 1778.' },\n    { s:'Cruzó la Cordillera de los Andes con su ejército.', v:true, e:'Lo hizo entre enero y febrero de 1817.' },\n    { s:'Fue presidente de la Argentina.', v:false, e:'Nunca fue presidente: se retiró de la vida pública.' },\n    { s:'Creó el Regimiento de Granaderos a Caballo.', v:true, e:'Lo creó en 1813 y todavía existe.' },\n    { s:'Ayudó a liberar Chile y Perú.', v:true, e:'Chile en 1817-1818 y Perú en 1821.' },\n    { s:'Nunca salió de la Argentina.', v:false, e:'Vivió más de veinte años en Europa y murió en Francia.' }\n  ];\n  static COMPL = [\n    { before:'Nació en Yapeyú, provincia de', answer:'Corrientes', options:['Mendoza','Corrientes','Salta'] },\n    { before:'Cruzó la Cordillera de los', answer:'Andes', options:['Alpes','Pirineos','Andes'] },\n    { before:'Fue el creador del Regimiento de', answer:'Granaderos', options:['Húsares','Granaderos','Cazadores'] },\n    { before:'En 1821 proclamó la independencia del', answer:'Perú', options:['Brasil','Paraguay','Perú'] },\n    { before:'Lo recordamos cada 17 de', answer:'agosto', options:['junio','agosto','mayo'] }\n  ];\n  static TIMELINE = [\n    { year:1778, text:'Nace en Yapeyú, Corrientes' },\n    { year:1812, text:'Llega a Buenos Aires desde Europa' },\n    { year:1813, text:'Crea el Regimiento de Granaderos a Caballo' },\n    { year:1817, text:'Cruza los Andes y vence en Chacabuco' },\n    { year:1818, text:'Triunfa en Maipú: Chile queda libre' },\n    { year:1821, text:'Proclama la independencia del Perú' },\n    { year:1850, text:'Fallece en Boulogne-sur-Mer, Francia' }\n  ];\n  static TIMELINE_SHUFFLE = [3,0,5,1,6,2,4];\n  static SECRETO = [\n    { masked:'S_N M_RT_N', hint:'Apellido del Padre de la Patria', answer:'SAN MARTIN' },\n    { masked:'GR_N_D_R_S', hint:'Su regimiento a caballo', answer:'GRANADEROS' },\n    { masked:'_ND_S', hint:'Cordillera que cruzó', answer:'ANDES' },\n    { masked:'P_TR__', hint:'Por ella luchó', answer:'PATRIA' },\n    { masked:'L_B_RT_D', hint:'Lo que buscaba para América', answer:'LIBERTAD' }\n  ];\n  static SOPA_GRID = ['SANMARTIN','OLECURBOL','ANDESLOBE','URCOLEBAT','PATRIALOU','CEBORULAN'];\n  static SOPA_WORDS = [\n    { word:'SANMARTIN', label:'SAN MARTÍN', row:0, cStart:0, cEnd:8 },\n    { word:'ANDES', label:'ANDES', row:2, cStart:0, cEnd:4 },\n    { word:'PATRIA', label:'PATRIA', row:4, cStart:0, cEnd:5 }\n  ];\n  static PUZZLE_INITIAL = [4,0,7,1,8,3,6,2,5];\n  static GAME_IDS = ['quiz','vf','compl','timeline','secreto','sopa','puzzle','mapa','vestir'];\n  static GAME_HUES = [18,42,95,150,205,260,320,205,30];\n  static INCLUSIVE_IDS = ['escuchar','pares','pintar'];\n  static ALL_IDS = ['quiz','vf','compl','timeline','secreto','sopa','puzzle','mapa','vestir','escuchar','pares','pintar','cazar','cuento','ahorcado','batalla','laberinto','crucigrama'];\n  static ESCUCHAR = [\n    { say:'San Martín cruzó la Cordillera de los Andes con su ejército.', q:'¿Qué cruzó San Martín?', options:[{icon:'⛰️ e(upd);\n  }\n  resetSecreto(){ this.setState({ secreto:{ idx:0, score:0, input:'', answered:false } }); }\n\n  clickSopaCell(r,c){\n    const sel = this.state.sopa.sel;\n    if(!sel){ this.setState(st=>({ sopa:{...st.sopa, sel:{r,c}} })); return; }\n    if(sel.r===r && sel.c===c){ this.setState(st=>({ sopa:{...st.sopa, sel:null} })); return; }\n    if(sel.r!==r){ this.setState(st=>({ sopa:{...st.sopa, sel:{r,c}} })); return; }\n    const cStart = Math.min(sel.c,c), cEnd = Math.max(sel.c,c);\n    const substr = Component.SOPA_GRID[r].slice(cStart,cEnd+1);\n    const target = Component.SOPA_WORDS.find(w=> w.row===r && w.word===substr);\n    if(target && !this.state.sopa.found.includes(target.word)){\n      this.playCorrect();\n      const found = [...this.state.sopa.found, target.word];\n      const upd = { sopa:{ sel:null, found } };\n      if(found.length===Component.SOPA_WORDS.length){\n        const badges = this.mergeBadge('sopa',3);\n        if(badges) upd.badges = badges;\n        this.playLevelUp();\n      }\n      this.setState(upd);\n    } else {\n      this.playWrong();\n      this.setState(st=>({ sopa:{...st.sopa, sel:null} }));\n    }\n  }\n  resetSopa(){ this.setState({ sopa:{ sel:null, found:[] } }); }\n\n  clickPuzzle(pos){\n    const sel = this.state.puzzle.selected;\n    if(sel===null){ this.setState(st=>({ puzzle:{...st.puzzle, selected:pos} })); return; }\n    if(sel===pos){ this.setState(st=>({ puzzle:{...st.puzzle, selected:null} })); return; }\n    const order = [...this.state.puzzle.order];\n    const tmp = order[sel]; order[sel]=order[pos]; order[pos]=tmp;\n    const moves = this.state.puzzle.moves+1;\n    const upd = { puzzle:{ order, selected:null, moves } };\n    if(order.every((v,i)=>v===i)){\n      const badges = this.mergeBadge('puzzle', moves<=10?3: moves<=18?2:1);\n      if(badges) upd.badges = badges;\n      this.playLevelUp();\n    }\n    this.setState(upd);\n  }\n  resetPuzzle(){ this.setPuzzleSize(this.state.puzzle.size || 3); }\n  setPuzzleSize(n){\n    let order;\n    do { order = Array.from({length:n*n},(_,i)=>i); for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; } } while(order.every((v,i)=>v===i));\n    this.setState({ puzzle:{ order, selected:null, moves:0, size:n } });\n  }\n\n  clickMapa(i){\n    const step = this.state.mapa.step;\n    if(i!==step) return;\n    this.playCorrect();\n    const next = step+1;\n    const upd = { mapa:{ step:next } };\n    if(next===Component.MAPA.length){\n      const b = this.mergeBadge('mapa',3);\n      if(b) upd.badges = b;\n      this.playLevelUp();\n    }\n    this.setState(upd);\n  }\n  resetMapa(){ this.setState({ mapa:{ step:0 } }); }\n\n  selectVestir(opt){\n    const s = this.state.vestir;\n    if(s.answered || s.idx>=Component.VESTIR.length) return;\n    const correct = opt===Component.VESTIR[s.idx].correct;\n    correct ? this.playCorrect() : this.playWrong();\n    this.setState(st=>({ vestir:{...st.vestir, selected:opt, answered:true, score: st.vestir.score+(correct?1:0)} }));\n  }\n  nextVestir(){\n    const v = this.state.vestir;\n    const idx = v.idx+1;\n    const upd = { vestir:{...v, idx, selected:null, answered:false} };\n    if(idx>=Component.VESTIR.length){\n      const b = this.mergeBadge('vestir', this.starsFor(v.score/Component.VESTIR.length));\n      if(b) upd.badges = b;\n      this.playLevelUp();\n    }\n    this.setState(upd);\n  }\n  resetVestir(){ this.setState({ vestir:{ idx:0, score:0, selected:null, answered:false } }); }\n\n  componentWillUnmount(){\n    if(this._onResize) window.removeEventListener('resize', this._onResize);\n    this.stopMusica();\n  }\n  toggleSettings(){ this.setState(s=>({ settingsOpen:!s.settingsOpen })); }\n  buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||18); }catch(e){} }\n\n  cycleLetra(){\n    const seq = ['normal','mayus','minus'];\n    const i = seq.indexOf(this.state.letra);\n    this.setState({ letra: s \n    const upd = { pintar:{...p, cells} };\n    if(Object.keys(cells).length===Component.PINTAR_CELLS){\n      const b = this.mergeBadge('pintar',3);\n      if(b) upd.badges = b;\n      this.playLevelUp();\n    }\n    this.setState(upd);\n  }\n  resetPintar(){ this.setState(s=>({ pintar:{ color:s.pintar.color, cells:{} } })); }\n\n  clickCazar(i){\n    const c = this.state.cazar;\n    if(c.done) return;\n    const round = Component.CAZAR[c.round];\n    const it = round.items[i];\n    if(c.found.includes(i)) return;\n    if(!it.ok){ this.playWrong(); this.setState(st=>({ cazar:{...st.cazar, wrong:st.cazar.wrong+1} })); return; }\n    this.playCorrect();\n    const found = [...c.found, i];\n    const okCount = round.items.filter(x=>x.ok).length;\n    const gotOk = found.filter(fi=>round.items[fi].ok).length;\n    if(gotOk >= okCount){\n      const nextRound = c.round+1;\n      if(nextRound >= Component.CAZAR.length){\n        const stars = c.wrong===0?3 : c.wrong<=2?2 : 1;\n        const b = this.mergeBadge('cazar', stars);\n        const upd = { cazar:{...c, found, done:true} };\n        if(b) upd.badges = b;\n        this.playLevelUp();\n        this.setState(upd);\n      } else {\n        this.setState({ cazar:{ round:nextRound, found:[], wrong:c.wrong, done:false } });\n      }\n    } else {\n      this.setState({ cazar:{...c, found} });\n    }\n  }\n  resetCazar(){ this.setState({ cazar:{ round:0, found:[], wrong:0, done:false } }); }\n\n  pickCuento(oi){\n    const order = this.state.cuento.order;\n    if(order.includes(oi) || order.length>=Component.CUENTO.length) return;\n    const no = [...order, oi];\n    const upd = { cuento:{ order:no } };\n    if(no.length===Component.CUENTO.length){\n      const correct = no.every((v,i)=>v===i);\n      const b = this.mergeBadge('cuento', correct?3:1);\n      if(b) upd.badges = b;\n      correct ? this.playLevelUp() : this.playWrong();\n    }\n    this.setState(upd);\n  }\n  resetCuento(){ this.setState({ cuento:{ order:[] } }); }\n\n  guessLetter(l){\n    const a = this.state.ahorcado;\n    if(a.ended || a.guessed.includes(l)) return;\n    const word = Component.AHORCADO[a.idx].word;\n    const guessed = [...a.guessed, l];\n    let wrong = a.wrong;\n    if(word.includes(l)){ this.playCorrect(); } else { wrong++; this.playWrong(); }\n    const solved = word.split('').every(ch=>guessed.includes(ch)||ch===' ');\n    const dead = wrong>=Component.AHORCADO_LIVES;\n    const upd = { ahorcado:{...a, guessed, wrong, ended: solved||dead, score: a.score+(solved?1:0)} };\n    this.setState(upd);\n  }\n  nextAhorcado(){\n    const a = this.state.ahorcado;\n    const idx = a.idx+1;\n    if(idx>=Component.AHORCADO.length){\n      const stars = this.starsFor(a.score/Component.AHORCADO.length);\n      const b = this.mergeBadge('ahorcado', stars);\n      const upd = { ahorcado:{...a, done:true} };\n      if(b) upd.badges = b;\n      this.playLevelUp();\n      this.setState(upd);\n    } else {\n      this.setState({ ahorcado:{ idx, guessed:[], wrong:0, score:a.score, ended:false, done:false } });\n    }\n  }\n  resetAhorcado(){ this.setState({ ahorcado:{ idx:0, guessed:[], wrong:0, score:0, ended:false, done:false } }); }\n\n  toggleDislexia(){ this.setState(s=>({ dislexia:!s.dislexia })); }\n\n  toggleMusica(){\n    if(this._music){ this.stopMusica(); this.setState({ musica:false }); }\n    else { this.startMusica(); this.setState({ musica:true }); }\n  }\n  startMusica(){\n    try{\n      const ctx = this._actx || (this._actx = new (window.AudioContext||window.webkitAudioContext)());\n      if(ctx.state==='suspended'){ ctx.resume(); }\n      const melody = [392,440,494,523,587,523,494,440, 392,440,494,392, 349,392,440,392];\n      let i = 0;\n      const playNote = ()=>{\n        const f = melody[i%melody.length]; i++;\n        const osc = ctx.createOscillator(), g = ctx.createGain();\n        osc.type='triangle'; osc.frequency.value=f;\n        osc.connect(g); g.connect(ctx.destination);\n        const t = ctx.currentTime;\n        g.gain.setValueAtTime(0.0001,t);\n        g.gain.exponentialRampToValueAtTime(0.045,t+0.05);\n        g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);\n        osc.start(t); osc.stop(t+0.45);\n      };\n      playNote();\n      this._music = setInterval(playNote, 480);\n    }catch(e){}\n  }\n  stopMusica(){ if(this._music){ clearInterval(this._music); this._music=null; } }\n\n  answerBatalla(i){\n    const b = this.state.batalla;\n    if(b.answered || b.idx>=this.quizBank().length) return;\n    const q = this.quizBank()[b.idx];\n    const correct = i===q.correct;\n    correct ? this.playCorrect() : this.playWrong();\n    const scores = correct ? b.scores.map((s,ti)=> ti===b.team? s+1 : s) : b.scores;\n    this.setState({ batalla:{...b, selected:i, answered:true, scores} });\n  }\n  nextBatalla(){\n    const b = this.state.batalla;\n    const idx = b.idx+1;\n    if(idx>=this.quizBank().length){\n      const bd = this.mergeBadge('batalla', 3);\n      const upd = { batalla:{...b, done:true} };\n      if(bd) upd.badges = bd;\n      this.playLevelUp();\n      this.setState(upd);\n    } else {\n      this.setState({ batalla:{...b, idx, team: b.team===0?1:0, selected:null, answered:false} });\n    }\n  }\n  resetBatalla(){ this.setState({ batalla:{ idx:0, team:0, scores:[0,0], selected:null, answered:false, done:false } }); }\n\n  moveMaze(dr,dc){\n    const m = this.state.laberinto;\n    if(m.won) return;\n    const nr = m.r+dr, nc = m.c+dc;\n    const row = Component.MAZE[nr];\n    if(!row || nc<0 || nc>=row.length || row[nc]==='#') { this.buzz(10); return; }\n    const won = row[nc]==='E';\n    const upd = { laberinto:{ r:nr, c:nc, moves:m.moves+1, won } };\n    if(won){ const b=this.mergeBadge('laberinto',3); if(b) upd.badges=b; this.playLevelUp(); } else { this.playTone(520,0.05); }\n    this.setState(upd);\n  }\n  resetLaberinto(){ this.setState({ laberinto:{ r:1, c:1, moves:0, won:false } }); }\n\n  setCruci(key,val){\n    co Name: teamNames[bt.team],\n      question:'', options:[], progress:'', answered:bt.answered, next:()=>this.nextBatalla(),\n      nextDisabled:true, nextOpacity:'0.5', reset:()=>this.resetBatalla(),\n      winnerText: bt.scores[0]===bt.scores[1]? '¡Empate! Gran partido.' : ('🏆 ¡Ganó el '+btWinner+'!'),\n      winnerColor: bt.scores[0]===bt.scores[1]? theme.accent : (bt.scores[0]>bt.scores[1]? teamColors[0]:teamColors[1]) };\n    if(!btDone){\n      const q = this.quizBank()[bt.idx];\n      batallaBlock.question = q.q;\n      batallaBlock.progress = (bt.idx+1)+' / '+btTotal;\n      batallaBlock.nextDisabled = !bt.answered;\n      batallaBlock.nextOpacity = bt.answered? '1':'0.5';\n      batallaBlock.options = q.options.map((opt,i)=>{\n        const isCorrect=i===q.correct, isPicked=bt.selected===i;\n        let bg=theme.panel, borderColor=theme.border, anim='none';\n        if(bt.answered && isCorrect){ bg='#DFF5E1'; borderColor='#2E9E4A'; anim='glowPulse .6s ease'; }\n        else if(bt.answered && isPicked){ bg='#FBE0E0'; borderColor='#D64545'; anim='shakeX .4s ease'; }\n        return { text:opt, bg, borderColor, anim, textColor: inkFor(bg), onClick:()=>this.answerBatalla(i) };\n      });\n    }\n\n    // Laberinto\n    const mz = s.laberinto;\n    const mazeRows = Component.MAZE.map((rowStr,r)=>({\n      cells: rowStr.split('').map((ch,c)=>{\n        const isWall = ch==='#', isPlayer = mz.r===r && mz.c===c, isEnd = ch==='E';\n        return { wall:isWall,\n          bg: isWall? theme.mountain : (isPlayer? theme.quoteBg : (isEnd? '#DFF5E1' : theme.panel)),\n          content: isPlayer? '🐎' : (isEnd? '🏁' : '') };\n      })\n    }));\n    const laberintoBlock = { rows:mazeRows, moves:mz.moves, won:mz.won,\n      up:()=>this.moveMaze(-1,0), down:()=>this.moveMaze(1,0), left:()=>this.moveMaze(0,-1), right:()=>this.moveMaze(0,1),\n      reset:()=>this.resetLaberinto() };\n\n    // Crucigrama\n    const cgSol = this.cruciSolution();\n    const cgActive = {}, cgNum = {};\n    Component.CRUCI_WORDS.forEach(w=>{ cgNum[w.row+'-'+w.col] = w.num; for(let i=0;i<w.answer.length;i++){ const r=w.dir==='D'?w.row+i:w.row, c=w.dir==='A'?w.col+i:w.col; cgActive[r+'-'+c]=true; } });\n    const cgCells = s.crucigrama.cells, cgChecked = s.crucigrama.checked;\n    const crucRows = [];\n    for(let r=0;r<Component.CRUCI_ROWS;r++){\n      const cells=[];\n      for(let c=0;c<Component.CRUCI_COLS;c++){\n        const key=r+'-'+c, active=!!cgActive[key];\n        let bg=theme.panel, border=theme.border;\n        const val=cgCells[key]||'';\n        if(cgChecked && active){ if(val===cgSol[key]){ bg='#DFF5E1'; border='#2E9E4A'; } else { bg='#FBE0E0'; border='#D64545'; } }\n        cells.push({ active, blank:!active, val, num: cgNum[key]? String(cgNum[key]):'', bg, border, textColor: (cgChecked && active)? '#12233B':theme.text, onInput:(e)=>this.setCruci(key, e.target.value) });\n      }\n      crucRows.push({ cells });\n    }\n    const crucAllOk = Object.keys(cgSol).every(k=>(cgCells[k]||'')===cgSol[k]);\n    const crucigramaBlock = { rows:crucRows, checked:cgChecked, solved: crucAllOk,\n      cluesA: Component.CRUCI_WORDS.filter(w=>w.dir==='A').map(w=>({ num:w.num, clue:w.clue })),\n      cluesD: Component.CRUCI_WORDS.filter(w=>w.dir==='D').map(w=>({ num:w.num, clue:w.clue })),\n      resultText: cgChecked? (crucAllOk? '🎉 ¡Crucigrama completo y correcto!' : 'Todavía hay casilleros para corregir. ¡Seguí!') : '',\n      resultColor: crucAllOk? '#2E9E4A':'#D64545',\n      check:()=>this.checkCruci(), reset:()=>this.resetCrucigrama() };\n\n    // Diploma\n    const diploma = {\n      name: s.studentName,\n      displayName: s.studentName || '____________________',\n      onName: (e)=>this.setName(e.target.value),\n      print: ()=>this.printDiploma(),\n      printDisabled: !diplomaReady || !s.studentName,\n      printOpacity: (!diplomaReady || !s.studentName)? '0.5':'1',\n      institucion: this.props.institucion || 'Escuela',\n      celebrate: diplomaReady,\n      status: diplomaReady\n        ? (s.studentName? 'Todo listo: podés imprimir tu diploma.' : 'Escribí tu nombre para completar el diploma.')\n        : 'Completá las nueve estaciones de la ruta para desbloquear la impresión. Estrellas: '+totalStars+' de '+maxStars+'.'\n    };\n\n    const quizLevels = [['facil','Fácil'],['medio','Medio'],['dificil','Difícil']].map(function(p){ return { label:p[1], active:s.quizLevel===p[0], bg: s.quizLevel===p[0]? theme.accent:'transparent', color: s.quizLevel===p[0]? '#fff':theme.text, onClick:()=>this.setQuizLevel(p[0]) }; }, this);\n    const docentePanel = [\n      { key:'libre', label:'Modo libre: desbloquear todas las estaciones' },\n      { key:'showJuegos', label:'Mostrar la sección “Más juegos”' },\n      { key:'showInclusivas', label:'Mostrar la sección “Inclusivas”' }\n    ].map(function(o){ const active=!!_cfg[o.key]; return { label:o.label, bg: active? theme.accent:'transparent', color: active? '#fff':theme.text, onClick:()=>this.toggleDocente(o.key) }; }, this);\n    const nextId = this.nextIncompleteId();\n\n    const tabs = [\n      { id:'inicio', icon:'🏠', label:'Inicio' },\n      { id:'historia', icon:'📖', label:'Historia' },\n      { id:'ruta', icon:'🎮', label:'Jugar' },\n      { id:'inclusivas', icon:'🧩', label:'Inclusivas' },\n      { id:'juegos', icon:'🎲', label:'Juegos' },\n      { id:'diploma', icon:'🏅', label:'Diploma' }\n    ].filter(t=> (t.id!=='juegos' || _cfg.showJuegos) && (t.id!=='inclusivas' || _cfg.showInclusivas)).map(t=>{\n      const active = view===t.id || (t.id==='ruta' && view==='juego' && !isInclusiveGame && !isFreeGame) || (t.id==='inclusivas' && view==='juego' && isInclusiveGame) || (t.id==='juegos' && view==='juego' && isFreeGame);\n      return { icon:t.icon, label:t.label, color: active? '#fff':theme.muted, bg: active? theme.accent:'transparent', onClick: ()=>{ this.buzz(12); this.goto(t.id); } };\n    });\n\n    const _gq = {\n      quiz: quizBlock.question, vf: vfBlock.sentence, compl: complBlock.sentence,\n      secreto: secretoBlock.done? '' : ('Pista: '+secretoBlock.hint),\n      batalla: batallaBlock.question, escuchar: escucharBlock.question, cazar: cazarBlock.prompt,\n      ahorcado: ahorcadoBlock.done? '' : ('Pista: '+ahorcadoBlock.hint),\n      vestir: vestirBlock.part? ('¿Qué le ponemos en '+vestirBlock.part+'?') : ''\n    }[s.currentGame] || '';\n    const gameSpeech = (s.currentGame? (gameTitles[s.currentGame]||''):'') + '. ' + (s.currentGame? (gameHelps[s.currentGame]||''):'') + (_gq? '. '+_gq : '');\n    return {\n      theme, fs, L, isMobile, tabs, fancyBg: !contraste,\n      settingsOpen: s.settingsOpen, toggleSettings: ()=>this.toggleSettings(),\n      stopSheet: (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); },\n      gotoDocentes: ()=>{ this.setState({ settingsOpen:false }); this.goto('docentes'); },\n      totalStars, maxStars, progressPct: Math.round((totalStars/maxStars)*100)+'%',\n      isInicio: view==='inicio', isHistoria: view==='historia', isRuta: view==='ruta', isJuego: view==='juego', isDiploma: view==='diploma', isDocentes: view==='docentes', isInclusivas: view==='inclusivas', isJuegos: view==='juegos',\n      letterTransform, inclusiveCards,\n      isEscuchar: s.currentGame==='escuchar', isPares: s.currentGame==='pares', isPintar: s.currentGame==='pintar',\n      escuchar:escucharBlock, pares:paresBlock, pintar:pintarBlock,\n      backTarget: isFreeGame? 'Más juegos' : (isInclusiveGame? 'Inclusivas' : 'Ruta'),\n      gotoBack: isFreeGame? ()=>this.goto('juegos') : (isInclusiveGame? ()=>this.goto('inclusivas') : ()=>this.goto('ruta')),\n      gotoInicio:()=>this.goto('inicio'), gotoHistoria:()=>this.goto('historia'), gotoRuta:()=>this.goto('ruta'), gotoDiploma:()=>this.goto('diploma'), gotoInclusivas:()=>this.goto('inclusivas'), gotoJuegos:()=>this.goto('juegos'),\n      navItems, accessButtons,\n      heroStats:[{num:'5', label:'capítulos de historia'},{num:'9', label:'actividades interactivas'},{num:'27', label:'estrellas para ganar'}],\n      chapter, chapterDots,\n      stations, rutaHint: (this.props.modoLibre || this.state.docenteCfg.libre)? 'Modo libre activado: todas las estaciones están disponibles.' : 'Cada estación se desbloquea al completar la anterior.',\n      diplomaHint: diplomaReady? '¡Desbloqueado! Tocá para verlo e imprimirlo.' : 'Se desbloquea al completar las 9 estaciones.',\n      currentGameTitle: s.currentGame? gameTitles[s.currentGame]:'',\n      currentGameHelp: s.currentGame? gameHelps[s.currentGame]:'',\n      isQuiz: s.currentGame==='quiz', isVF: s.currentGame==='vf', isCompl: s.currentGame==='compl', isTimeline: s.currentGame==='timeline', isSecreto: s.currentGame==='secreto', isSopa: s.currentGame==='sopa', isPuzzle: s.currentGame==='puzzle', isMapa: s.currentGame==='mapa', isVestir: s.currentGame==='vestir', isCazar: s.currentGame==='cazar', isCuento: s.currentGame==='cuento', isAhorcado: s.currentGame==='ahorcado', isBatalla: s.currentGame==='batalla', isLaberinto: s.currentGame==='laberinto', isCrucigrama: s.currentGame==='crucigrama',\n      quizLevels, quiz:quizBlock, vf:vfBlock, compl:complBlock, timeline:timelineBlock, secreto:secretoBlock, sopa:sopaBlock, puzzle:puzzleBlock, mapa:mapaBlock, vestir:vestirBlock, cazar:cazarBlock, cuento:cuentoBlock, ahorcado:ahorcadoBlock, batalla:batallaBlock, laberinto:laberintoBlock, crucigrama:crucigramaBlock, freeplayCards, dyslexFont, dyslexLS, dyslexWS,\n      confettiPieces: Component.CONFETTI,\n      goNextStation: ()=>this.goNextStation(),\n      nextStationLabel: nextId? 'Siguiente actividad →' : 'Ver mi diploma 🏅',\n      diploma, medallas, medalStats, docentePanel, confettiBig: Component.CONFETTI_BIG, docenteCards: Component.DOCENTE_CARDS,\n      resetProgress: ()=>this.resetProgress(),\n      speakGame: ()=>this.speakNow(gameSpeech),\n      speakHero: ()=>this.speak('Cruzando los Andes con San Martín'),\n      speakHeroSub: ()=>this.speak('Una experiencia educativa completa sobre el Padre de la Patria.'),\n      speakQuote: ()=>this.speak('Seamos libres, que lo demás no importa nada. José de San Martín')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
